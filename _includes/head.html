<head>
	<link href="http://gmpg.org/xfn/11" rel="profile">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta http-equiv="content-type" content="text/html; charset=utf-8">
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="{% if page.summary %}{{ page.summary | strip_html | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">
	<meta name="author" content="{{ site.author.name }}">
	<link rel="canonical" href="{{ site.url }}{{ site.baseurl }}{{ page.url }}">

	<meta property="og:site_name" content="{{ site.title }}">
	<meta property="og:title" content="{% if page.title == 'Home' %}{{ site.title }} · {{ site.tagline }}{% else %}{{ page.title }} · {{ site.title }}{% endif %}">
	<meta property="og:description" content="{% if page.summary %}{{ page.summary | strip_html | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">
	<meta property="og:type" content="website">
	<meta property="og:locale" content="es_CO">
	<meta property="og:url" content="{{ site.url }}{{ site.baseurl }}{{ page.url }}">

	<title>
	{% if page.title == "Home" %}
	  {{ site.title }} &middot; {{ site.tagline }}
	{% else %}
	  {{ page.title }} &middot; {{ site.title }}
	{% endif %}
	</title>

	<link rel="stylesheet" href="https://use.typekit.net/dvx3ilf.css">
	<link rel="stylesheet" href="{{ site.baseurl }}/styles/css/style.css?v={{ site.version }}">
	<link rel="stylesheet" href="{{ site.baseurl }}/styles/css/person.css?v={{ site.version }}">
	<link rel="stylesheet" href="{{ site.baseurl }}/styles/css/kyma.css?v={{ site.version }}">
	<!--[if lt IE 9]>
	<link rel="stylesheet" href="{{ site.baseurl }}/styles/css/style_for_ie.css?v={{ site.version }}">
	<script src="https://oss.maxcdn.com/html5shiv/3.7.2/html5shiv.min.js"></script>
	<script src="https://oss.maxcdn.com/respond/1.4.2/respond.min.js"></script>
	<![endif]-->

	<link rel="apple-touch-icon" sizes="180x180" href="{{ site.baseurl }}/apple-touch-icon.png">
	<link rel="icon" type="image/png" sizes="32x32" href="{{ site.baseurl }}/favicon-32x32.png">
	<link rel="icon" type="image/png" sizes="16x16" href="{{ site.baseurl }}/favicon-16x16.png">
	<link rel="manifest" href="{{ site.baseurl }}/site.webmanifest">
	<link rel="mask-icon" href="{{ site.baseurl }}/safari-pinned-tab.svg" color="#002047">
	<meta name="msapplication-TileColor" content="#002047">
	<meta name="theme-color" content="#041C30">
	{% if page.title != "Contáctanos" %}<meta name="format-detection" content="telephone=no">{% endif %}

	<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
	<script>
  window.MathJax = {
    tex: {
      inlineMath: [['$', '$'], ['\\(', '\\)']],
      displayMath: [['$$', '$$'], ['\\[', '\\]']]
    }
  };
</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>

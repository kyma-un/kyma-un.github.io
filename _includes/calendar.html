    <p>Reuniones, hitos de proyecto y actividades de laboratorio. Cambia de vista, recorre las fechas o abre un evento para ver el detalle.</p>
  </div>

  <div class="calendar-layout">
    <div class="calendar-main">
      <div class="calendar-toolbar-hint" id="calendar-view-label">Semana</div>
      <div id="calendar" data-kyma-calendar
           data-google-key="AIzaSyC4q0LKOb8iJflmiQeXgVZmceS0Gz23dOc"
           data-google-id="c_cf97322ca9b5c616b53de48342f7085a02f36628c9a6a3bd61e9b5fd6e22e6a9@group.calendar.google.com"></div>

    <p class="calendar-dialog-loc" id="calendar-dialog-loc" hidden></p>
    <div class="calendar-dialog-actions">
      <a id="calendar-dialog-link" href="#" target="_blank" rel="noopener noreferrer">Abrir en Google Calendar</a>
      <button type="submit" class="calendar-dialog-close">Cerrar</button>
    </div>
  </form>
</dialog>
